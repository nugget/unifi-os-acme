name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --shell=sh --severity=warning deploy/unifi_os.sh dnsapi/dns_allns.sh \
            entrypoint.sh healthcheck.sh lib/certpath.sh test/gate_harness.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --shell=bash --severity=warning test/run.sh
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The suite stands up mock nameservers and a mock UniFi OS console on a
      # throwaway docker network. It never talks to a real CA or console.
      - name: integration tests
        run: bash test/run.sh
